<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSC VLE Training Attendance Form</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; font-family: Arial, sans-serif;
      background: #f2f5f9; min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    .container {
      width: 92%; max-width: 500px; background: #ffffff;
      border-radius: 16px; padding: 30px 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12); text-align: center;
    }
    .logo { font-size: 45px; margin-bottom: 10px; }
    h1 { margin: 5px 0 4px; font-size: 22px; color: #1f2937; }
    h2 { margin: 0 0 18px; font-size: 18px; color: #2563eb; font-weight: 600; }
    .subtitle { font-size: 15px; color: #6b7280; margin-bottom: 25px; line-height: 1.5; }
    label { display: block; text-align: left; font-size: 14px; font-weight: bold; color: #374151; margin-bottom: 6px; }

    .password-wrapper { position: relative; width: 100%; }
    .password-mask {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center; gap: 14px;
      pointer-events: none; font-size: 26px; color: #d1d5db;
    }
    .password-mask span.filled { color: #1f2937; }

    #password {
      width: 100%; padding: 14px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 18px; text-align: center;
      outline: none; background: transparent; color: transparent;
      caret-color: #2563eb; letter-spacing: 12px;
    }
    #password:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.12); }

    button {
      width: 100%; margin-top: 15px; padding: 14px; border: none;
      border-radius: 8px; background: #2563eb; color: white;
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:disabled { background: #93c5fd; cursor: not-allowed; }

    .message { margin-top: 15px; min-height: 22px; font-size: 14px; font-weight: bold; }
    .error { color: #dc2626; }
    .loading { color: #2563eb; }

    /* Custom Web Form */
    #formWrapper {
      display: none; width: 92%; max-width: 600px;
      background: #ffffff; border-radius: 16px; padding: 30px 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12); margin: 30px auto;
    }
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-control {
      width: 100%; padding: 12px 14px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 15px; outline: none;
    }
    .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.12); }
    .field-hint { display: flex; justify-content: space-between; font-size: 12px; color: #6b7280; margin-top: 4px; }
    .field-error { color: #dc2626; font-size: 12px; margin-top: 4px; display: none; }

    /* Google Form Container */
    #formContainer { display: none; width: 100%; min-height: 100vh; background: #ffffff; }
    #googleForm { width: 100%; height: 100vh; min-height: 800px; border: none; display: block; }
  </style>
</head>

<body>

  <!-- Password Section -->
  <div class="container" id="passwordContainer">
    <div class="logo">📋</div>
    <h1>CSC VLE Attendance For</h1>
    <h2 id="trainingTitle">Training Portal</h2>
    
    <div class="subtitle">
      Attendance Form खोलने के लिए<br>
      कृपया Training Password दर्ज करें।
    </div>

    <form id="passwordForm">
      <label for="password">Password</label>
      
      <div class="password-wrapper">
        <div class="password-mask" id="passwordMask">
          <span>•</span><span>•</span><span>•</span><span>•</span><span>•</span><span>•</span>
        </div>
        
        <input 
          type="password" 
          inputmode="numeric" 
          id="password" 
          maxlength="6" 
          autocomplete="off" 
          oninput="updateMask(this)"
          required
        >
      </div>

      <button type="submit" id="verifyButton">Verify & Continue</button>
    </form>

    <div id="message" class="message"></div>
    <div style="margin-top: 25px; font-size: 12px; color: #9ca3af;">CSC State Office</div>
  </div>

  <!-- 1. Custom Webpage Form (For Labour eKYC) -->
  <div id="formWrapper">
    <div style="text-align: center; margin-bottom: 20px;">
      <div style="font-size: 35px;">📝</div>
      <h2 id="activeSessionHeader" style="margin: 5px 0; color: #1f2937;">Labour eKYC Attendance Form</h2>
      <p style="font-size: 13px; color: #6b7280; margin: 0;">कृपया अपनी सभी जानकारी सही-सही दर्ज करें।</p>
    </div>

    <form id="attendanceForm">
      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" class="form-control" placeholder="example@gmail.com" required>
      </div>

      <div class="form-group">
        <label for="district">District Name *</label>
        <select id="district" class="form-control" required onchange="populateBlocks()">
          <option value="">-- Select District --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="block">Block *</label>
        <select id="block" class="form-control" required disabled>
          <option value="">-- First Select District --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="gpWard">Gram Panchayat / Ward *</label>
        <input type="text" id="gpWard" class="form-control" placeholder="Enter Gram Panchayat or Ward" required>
      </div>

      <div class="form-group">
        <label for="cscId">CSC ID (12 Digits) *</label>
        <input 
          type="text" 
          id="cscId" 
          class="form-control" 
          maxlength="12" 
          inputmode="numeric" 
          placeholder="e.g. 274712200015" 
          oninput="handleCscInput(this)" 
          required
        >
        <div class="field-hint">
          <span>Rule: 9th & 10th '00', 11th '1'</span>
          <span id="cscCounter" style="font-weight: bold;">0/12</span>
        </div>
        <div id="cscError" class="field-error"></div>
      </div>

      <div class="form-group">
        <label for="vleName">VLE Full Name *</label>
        <input type="text" id="vleName" class="form-control" placeholder="Enter Full Name" required>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number (10 Digits) *</label>
        <input 
          type="tel" 
          id="mobile" 
          class="form-control" 
          maxlength="10" 
          inputmode="numeric" 
          placeholder="10 digit mobile number" 
          oninput="this.value = this.value.replace(/[^0-9]/g, '')"
          required
        >
      </div>

      <button type="submit" id="submitFormBtn">Submit Attendance</button>
    </form>
    <div id="formSubmissionMsg" class="message"></div>
  </div>

  <!-- 2. Secure Embedded Google Form (For WiFi Choupal) -->
  <div id="formContainer">
    <iframe id="googleForm" src="" frameborder="0">Loading Form...</iframe>
  </div>

  <script>
    const SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwpTTctuIyzL7eLBUKd5shb7NioozZ5iqYUQYSmwWGpKsPN-QmpXZ0JXg0om1bfj74l/exec";

    const districtBlockData = {
      "Balod": ["Balod", "Dondi", "Dondi Luhara", "Gunderdehi", "Gurur"],
      "Baloda Bazar": ["Baloda Bazar", "Bhatapara", "Kasdol", "Palari", "Simga"],
      "Balrampur": ["Balrampur", "Kusmi", "Rajpur", "Ramchandrapur", "Samri", "Shankargarh", "Wadrafnagar"],
      "Bastar": ["Bastanar", "Bastar", "Bakawand", "Darbha", "Jagdalpur", "Lohandiguda", "Tokapal"],
      "Bemetara": ["Bemetara", "Berla", "Nawagarh", "Saja", "Thanakhamria"],
      "Bijapur": ["Bhopalpattanam", "Bijapur", "Bhairamgarh", "Usur"],
      "Bilaspur": ["Bilha", "Kota", "Masturi", "Takhatpur", "Belha"],
      "Dantewada": ["Dantewada", "Geedam", "Katekalyan", "Kuwakonda"],
      "Dhamtari": ["Dhamtari", "Kurud", "Magarlod", "Nagri"],
      "Durg": ["Durg", "Dhamdha", "Patan"],
      "Gariaband": ["Chhura", "Deobhog", "Fingeshwar", "Gariaband", "Mainpur"],
      "Gaurela Pendra Marwahi": ["Gaurela", "Marwahi", "Pendra"],
      "Janjgir-Champa": ["Akaltara", "Baloda", "Champa", "Janjgir", "Nawagarh", "Pamgarh"],
      "Jashpur": ["Bagicha", "Duldula", "Farsabahar", "Jashpur", "Kunkuri", "Kansabel", "Manora", "Pathalgaon"],
      "Kabirdham": ["Bodla", "Kawardha", "Pandariya", "Sahaspur Lohara"],
      "Kanker": ["Antagarh", "Bhanupratappur", "Charama", "Durgukondal", "Kanker", "Koyalibeda", "Narharpur"],
      "Khairagarh": ["Chhuikhadan", "Gandai", "Khairagarh"],
      "Kondagaon": ["Bade Rajpur", "Faraskgaon", "Keshkal", "Kondagaon", "Makdi"],
      "Korba": ["Katghora", "Korba", "Kartala", "Pali", "Poundi-Uproda"],
      "Koriya": ["Baikunthpur", "Sonhat"],
      "Mahasamund": ["Bagbahra", "Basna", "Mahasamund", "Pithora", "Saraipali"],
      "Manendragarh": ["Bharatpur", "Khadgawan", "Manendragarh"],
      "Mohla Manpur": ["Ambagarh Chowki", "Manpur", "Mohla"],
      "Mungeli": ["Lormi", "Mungeli", "Pathariya"],
      "Narayanpur": ["Narayanpur", "Orchha"],
      "Raigarh": ["Baramkela", "Gharghoda", "Kharsia", "Lailunga", "Pussore", "Raigarh", "Tamnar", "Dharamjaigarh"],
      "Raipur": ["Abhanpur", "Arang", "Dharsiwa", "Tilda"],
      "Rajnandgaon": ["Chhuria", "Dongargaon", "Dongargarh", "Rajnandgaon"],
      "Sarangarh Bilaigarh": ["Baramkela", "Bilaigarh", "Sarangarh"],
      "Sakti": ["Dabhra", "Jaijaipur", "Malkharoda", "Sakti"],
      "Sukma": ["Chhindgarh", "Konta", "Sukma"],
      "Surajpur": ["Bhaiyathan", "Bishrampur", "Odgi", "Pratappur", "Premnagar", "Ramanujnagar", "Surajpur"],
      "Surguja": ["Ambikapur", "Batauli", "Lakhanpur", "Lundra", "Mainpat", "Sitapur", "Udaipur"]
    };

    function initDistricts() {
      const distSelect = document.getElementById("district");
      distSelect.innerHTML = '<option value="">-- Select District --</option>';
      Object.keys(districtBlockData).sort().forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        distSelect.appendChild(opt);
      });
    }

    function populateBlocks() {
      const dist = document.getElementById("district").value;
      const blkSelect = document.getElementById("block");
      blkSelect.innerHTML = '<option value="">-- Select Block --</option>';

      if (dist && districtBlockData[dist]) {
        districtBlockData[dist].forEach(b => {
          const opt = document.createElement("option");
          opt.value = b;
          opt.textContent = b;
          blkSelect.appendChild(opt);
        });
        blkSelect.disabled = false;
      } else {
        blkSelect.disabled = true;
      }
    }

    function handleCscInput(input) {
      input.value = input.value.replace(/[^0-9]/g, '');
      const val = input.value;
      const counter = document.getElementById("cscCounter");
      const err = document.getElementById("cscError");
      counter.textContent = `${val.length}/12`;

      if (val.length === 12) {
        const ninth = val.charAt(8);
        const tenth = val.charAt(9);
        const eleventh = val.charAt(10);

        if (ninth !== '0' || tenth !== '0' || eleventh !== '1') {
          err.textContent = "अमान्य CSC ID: 9th और 10th digit '00' तथा 11th digit '1' होना चाहिए!";
          err.style.display = "block";
        } else {
          err.style.display = "none";
        }
      } else {
        err.style.display = "none";
      }
    }

    // GitHub Config Fetching
    const GITHUB_USERNAME = "cscchhattisgarh"; 
    const REPO_NAME = "labour-ekcy-training-attendance"; 
    const FILE_PATH = "config.json"; 
    const API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;

    const passwordForm = document.getElementById("passwordForm");
    const passwordInput = document.getElementById("password");
    const verifyButton = document.getElementById("verifyButton");
    const message = document.getElementById("message");
    const passwordContainer = document.getElementById("passwordContainer");
    const formWrapper = document.getElementById("formWrapper");
    const formContainer = document.getElementById("formContainer");
    const googleForm = document.getElementById("googleForm");

    function base64ToUtf8(str) {
      const binary = atob(str.replace(/\s/g, ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    function updateMask(input) {
      input.value = input.value.replace(/[^0-9]/g, '');
      const len = input.value.length;
      const spans = document.querySelectorAll('#passwordMask span');
      spans.forEach((span, index) => {
        if (index < len) { span.classList.add('filled'); } 
        else { span.classList.remove('filled'); }
      });
    }

    async function getConfig() {
      try {
        const res = await fetch(API_URL + '?_=' + Date.now());
        if (!res.ok) return null;
        const data = await res.json();
        const decodedText = base64ToUtf8(data.content);
        return JSON.parse(decodedText);
      } catch (e) {
        return null;
      }
    }

    function parseISODate(dateStr) {
      if (!dateStr) return null;
      let cleanStr = dateStr.trim();
      if (!cleanStr.includes('+') && !cleanStr.includes('Z')) {
        cleanStr += ":00+05:30";
      }
      return new Date(cleanStr);
    }

    passwordForm.addEventListener("submit", async function(e) {
      e.preventDefault();
      const userPwd = passwordInput.value.trim();

      if (!/^\d{6}$/.test(userPwd)) {
        message.textContent = "कृपया केवल 6 अंकों का Numeric Password दर्ज करें।";
        message.className = "message error";
        passwordInput.focus();
        return;
      }

      verifyButton.disabled = true;
      message.textContent = "Verifying Password...";
      message.className = "message loading";

      const config = await getConfig();

      if (!config) {
        verifyButton.disabled = false;
        message.textContent = "Config File Read Error! Admin se sampark karein.";
        message.className = "message error";
        return;
      }

      let matchingSessions = [];

      if (config.trainings && Array.isArray(config.trainings)) {
        matchingSessions = config.trainings.filter(t => String(t.password).trim() === userPwd);
      }

      if (matchingSessions.length === 0) {
        verifyButton.disabled = false;
        message.textContent = "गलत Password! सही Password दर्ज करें।";
        message.className = "message error";
        passwordInput.value = "";
        updateMask(passwordInput);
        passwordInput.focus();
        return;
      }

      const now = new Date();
      let activeSession = null;
      let isNotStartedYet = false;
      let isExpired = false;

      for (const session of matchingSessions) {
        const startTime = parseISODate(session.start_time);
        const expiryTime = parseISODate(session.expiry);

        if (startTime && now < startTime) {
          isNotStartedYet = true;
          continue;
        }

        if (expiryTime && (isNaN(expiryTime.getTime()) || now > expiryTime)) {
          isExpired = true;
          continue;
        }

        activeSession = session;
        break;
      }

      if (!activeSession) {
        verifyButton.disabled = false;
        if (isNotStartedYet && !isExpired) {
          message.textContent = "यह Training अभी शुरू नहीं हुई है!";
        } else {
          message.textContent = "यह Training Password Expire हो चुका है!";
        }
        message.className = "message error";
        passwordInput.value = "";
        updateMask(passwordInput);
        return;
      }

      // Password Success: ROUTING BASED ON TOPIC
      passwordContainer.style.display = "none";

      if (activeSession.topic_id === "wifi_choupal") {
        // WiFi Choupal: Load Google Form via Secure Backend Proxy
        googleForm.src = `${SCRIPT_WEB_APP_URL}?action=loadWifiForm`;
        formContainer.style.display = "block";
        document.body.style.background = "#ffffff";
      } else {
        // Labour eKYC: Load Custom Web Form
        initDistricts();
        document.getElementById("activeSessionHeader").textContent = activeSession.name || "Labour eKYC Attendance Form";
        formWrapper.style.display = "block";
        document.body.style.display = "block";
      }
    });

    // Form Submit Handler (Labour eKYC)
    document.getElementById("attendanceForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const cscId = document.getElementById("cscId").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const submitBtn = document.getElementById("submitFormBtn");
      const msg = document.getElementById("formSubmissionMsg");

      if (cscId.length !== 12) {
        alert("CSC ID ठीक 12 अंकों की होनी चाहिए!");
        return;
      }

      // 9th & 10th '00' and 11th '1'
      if (cscId.charAt(8) !== '0' || cscId.charAt(9) !== '0' || cscId.charAt(10) !== '1') {
        alert("अमान्य CSC ID! 9th और 10th digit '00' तथा 11th digit '1' होना अनिवार्य है।");
        return;
      }

      if (!/^\d{10}$/.test(mobile)) {
        alert("Mobile Number ठीक 10 अंकों का होना चाहिए!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Checking & Submitting...";
      msg.textContent = "";

      const payload = {
        email: document.getElementById("email").value.trim(),
        district: document.getElementById("district").value,
        block: document.getElementById("block").value,
        gpWard: document.getElementById("gpWard").value.trim(),
        cscId: cscId,
        name: document.getElementById("vleName").value.trim(),
        mobile: mobile
      };

      fetch(SCRIPT_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.duplicate) {
          alert("⚠️ " + data.message);
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit Attendance";
        } else if (data.success) {
          alert("✅ आपकी Attendance सफलतापूर्वक दर्ज हो गई है!");
          document.getElementById("attendanceForm").reset();
          document.getElementById("block").disabled = true;
          document.getElementById("cscCounter").textContent = "0/12";
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit Attendance";
        } else {
          alert("Error: " + (data.error || "Submission Failed"));
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit Attendance";
        }
      })
      .catch(err => {
        alert("Network/Server Error! कृपया पुनः प्रयास करें।");
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Attendance";
      });
    });
  </script>
</body>
</html>
