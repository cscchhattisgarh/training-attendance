<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Admin Panel - Dynamic Sessions</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 520px; }
    h2 { margin-top: 0; color: #1e293b; text-align: center; }
    label { font-weight: bold; font-size: 14px; color: #334155; display: block; margin: 15px 0 5px; }
    label span { color: #dc2626; }
    input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; outline: none; background: white; }
    input:focus, select:focus { border-color: #2563eb; }
    input:disabled, select:disabled { background: #f1f5f9; cursor: not-allowed; border-color: #e2e8f0; }
    
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-save { background: #2563eb; color: white; }
    .btn-fetch { background: #0f766e; color: white; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    
    .status { margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px; line-height: 1.4; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }

    .current-box {
      margin-top: 20px; padding: 15px; background: #f1f5f9; border-left: 4px solid #0f766e;
      border-radius: 6px; font-size: 13px; color: #1e293b; display: none; word-break: break-all;
      max-height: 280px; overflow-y: auto;
    }
    .current-box h4 { margin: 0 0 10px 0; color: #0f766e; font-size: 14px; }
    .vle-link-box {
      background: #e0f2fe; border: 1px solid #bae6fd; padding: 8px 10px;
      border-radius: 6px; margin-bottom: 12px; font-size: 13px; color: #0369a1;
    }
    .vle-link-box a { color: #2563eb; font-weight: bold; text-decoration: underline; }
    .training-item { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed #cbd5e1; }
  </style>
</head>
<body>

  <div class="card">
    <h2>⚙️ CSC Attendance Admin Panel</h2>

    <form id="adminForm" onsubmit="event.preventDefault(); updateConfig();">
      <label for="token">GitHub Personal Access Token (PAT): <span>*</span></label>
      <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx" required>

      <label for="trainingSelect">Select Training Topic: <span>*</span></label>
      <select id="trainingSelect" onchange="handleSelectionChange()" required>
        <option value="" disabled selected>-- Select Topic --</option>
        <option value="labour_ekyc">Labour eKYC Training (Web Form)</option>
        <option value="wifi_choupal">WiFi Choupal Training (Google Form)</option>
      </select>

      <label for="trainerSelect">Select Trainer: <span>*</span></label>
      <select id="trainerSelect" onchange="handleSelectionChange()" required>
        <option value="" disabled selected>-- Select Trainer --</option>
        <option value="neeraj_hardev">Neeraj Hardev</option>
        <option value="pushpen_kumar_verma">Pushpen Kumar Verma</option>
        <option value="krishnandan_kumar">Krishnandan Kumar</option>
        <option value="neeta_sahu">Neeta Sahu</option>
        <option value="suruchi_shesh">Suruchi Shesh</option>
        <option value="ravikant_sahu">Ravikant Sahu</option>
        <option value="rahul_soni">Rahul Soni</option>
        <option value="narayan_devnath">Narayan Devnath</option>
        <option value="vikas_nayak">Vikas Nayak</option>
        <option value="surendra_das">Surendra Das</option>
      </select>

      <label for="password">Set Password (6 Digits): <span>*</span></label>
      <input type="text" id="password" maxlength="6" pattern="\d{6}" placeholder="123456" disabled required>

      <label for="startTime">Start Date & Time (IST): <span>*</span></label>
      <input type="datetime-local" id="startTime" onchange="handleStartTimeChange()" disabled required>

      <label for="expiry">Expiry Date & Time (IST): <span>*</span></label>
      <input type="datetime-local" id="expiry" disabled required>

      <div class="btn-group">
        <button type="button" class="btn-fetch" id="fetchBtn" onclick="fetchCurrentConfig()">🔍 View Active Sessions</button>
        <button type="submit" class="btn-save" id="saveBtn" disabled>💾 Save & Deploy</button>
      </div>
    </form>

    <div id="status" class="status"></div>

    <div id="currentConfigBox" class="current-box">
      <h4>📌 Live Active Sessions:</h4>
      <div id="liveContent">Fetching...</div>
    </div>
  </div>

  <script>
    const GITHUB_USERNAME = "cscchhattisgarh"; 
    const REPO_NAME = "labour-ekcy-training-attendance"; 
    const FILE_PATH = "config.json"; 
    const API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;

    let cachedConfig = null;

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function base64ToUtf8(str) {
      const binary = atob(str.replace(/\s/g, ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    document.getElementById("token").value = localStorage.getItem("gh_pat") || "";

    function getCurrentDateTimeLocal() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    function generateUniqueId() {
      const topic = document.getElementById("trainingSelect").value;
      const trainer = document.getElementById("trainerSelect").value;
      if (!topic || !trainer) return "";
      return `${topic}_${trainer}`;
    }

    function handleSelectionChange() {
      const topic = document.getElementById("trainingSelect").value;
      const trainer = document.getElementById("trainerSelect").value;
      const isSelected = !!(topic && trainer);

      const startTimeInput = document.getElementById("startTime");
      const expiryInput = document.getElementById("expiry");

      document.getElementById("password").disabled = !isSelected;
      startTimeInput.disabled = !isSelected;
      expiryInput.disabled = !isSelected;
      document.getElementById("saveBtn").disabled = !isSelected;

      const nowFormatted = getCurrentDateTimeLocal();
      startTimeInput.min = nowFormatted;
      expiryInput.min = nowFormatted;
    }

    function handleStartTimeChange() {
      const startVal = document.getElementById("startTime").value;
      const expiryInput = document.getElementById("expiry");
      if (startVal) {
        expiryInput.min = startVal;
        if (expiryInput.value && expiryInput.value <= startVal) {
          expiryInput.value = "";
        }
      }
    }

    function formatISTDisplay(isoStr) {
      if (!isoStr) return "Not Set";
      try {
        const parts = isoStr.split("T");
        if (parts.length < 2) return isoStr;
        const dateParts = parts[0].split("-");
        const timeParts = parts[1].split("+")[0];
        return `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}, ${timeParts} IST`;
      } catch (e) { return isoStr; }
    }

    async function fetchCurrentConfig(silent = false) {
      const token = document.getElementById("token").value.trim();
      const status = document.getElementById("status");
      const box = document.getElementById("currentConfigBox");
      const liveContent = document.getElementById("liveContent");

      if (!silent) {
        status.textContent = "Fetching & Cleaning Live Config...";
        status.className = "status";
      }

      try {
        const headers = token ? { "Authorization": `token ${token}` } : {};
        const res = await fetch(API_URL + '?_=' + Date.now(), { headers });

        if (res.ok) {
          const getData = await res.json();
          const sha = getData.sha;
          cachedConfig = JSON.parse(base64ToUtf8(getData.content));

          if (!cachedConfig.trainings || !Array.isArray(cachedConfig.trainings)) {
            cachedConfig.trainings = [];
          }

          // Auto-Cleanup: Expired sessions remove karna
          const nowTime = new Date();
          const initialCount = cachedConfig.trainings.length;

          const activeTrainings = cachedConfig.trainings.filter(t => {
            if (!t.expiry) return false;
            let expDateStr = t.expiry.trim();
            if (!expDateStr.includes('+') && !expDateStr.includes('Z')) {
              expDateStr += ":00+05:30";
            }
            const exp = new Date(expDateStr);
            return !isNaN(exp.getTime()) && exp > nowTime;
          });

          if (activeTrainings.length !== initialCount && token) {
            cachedConfig.trainings = activeTrainings;
            const contentEncoded = utf8ToBase64(JSON.stringify(cachedConfig, null, 2));

            fetch(API_URL, {
              method: "PUT",
              headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
              body: JSON.stringify({
                message: "Auto-cleaned expired sessions via View Active Sessions",
                content: contentEncoded,
                sha: sha
              })
            }).catch(err => console.error("Auto-clean error:", err));
          } else {
            cachedConfig.trainings = activeTrainings;
          }

          if (!silent) {
            let html = `<div class="vle-link-box">
              🔗 <b>Attendance Link for VLEs:</b><br>
              <a href="https://cscchhattisgarh.github.io/training-attendance/" target="_blank">
                https://cscchhattisgarh.github.io/training-attendance/
              </a>
            </div>`;

            if (cachedConfig.trainings.length > 0) {
              cachedConfig.trainings.forEach(t => {
                html += `<div class="training-item">
                  <strong style="color:#0f766e;">📌 ${t.name}:</strong><br>
                  <b>Type:</b> ${t.topic_id === 'wifi_choupal' ? 'WiFi Choupal (Google Form)' : 'Labour eKYC (Web Form)'}<br>
                  <b>Password:</b> ${t.password || 'N/A'}<br>
                  <b>Start:</b> ${formatISTDisplay(t.start_time)}<br>
                  <b>Expiry:</b> ${formatISTDisplay(t.expiry)}
                </div>`;
              });
            } else {
              html += "<div style='color: #64748b; padding: 6px 0;'>Koi active session uplabdh nahi hai (sab expire ho chuke hain).</div>";
            }

            liveContent.innerHTML = html;
            box.style.display = "block";
            status.textContent = "✅ Active sessions fetched & cleaned!";
            status.className = "status success";
          }
        } else if (!silent) {
          status.textContent = "❌ Error fetching config! Check Token permissions.";
          status.className = "status error";
        }
      } catch (e) {
        if (!silent) {
          status.textContent = "❌ Network Error!";
          status.className = "status error";
        }
      }
    }

    async function updateConfig() {
      const token = document.getElementById("token").value.trim();
      const topicValue = document.getElementById("trainingSelect").value;
      const uniqueId = generateUniqueId();
      
      const pwd = document.getElementById("password").value.trim();
      const startVal = document.getElementById("startTime").value;
      const expVal = document.getElementById("expiry").value;
      const status = document.getElementById("status");
      const saveBtn = document.getElementById("saveBtn");

      if (!uniqueId || !token || !pwd || !startVal || !expVal) {
        status.textContent = "❌ Kripya sabhi mandatory fields bharein!";
        status.className = "status error";
        return;
      }

      if (!/^\d{6}$/.test(pwd)) {
        status.textContent = "❌ Password keval 6 numeric digits ka hona chahiye!";
        status.className = "status error";
        return;
      }

      let sessionName = (topicValue === "labour_ekyc") 
        ? "Labour eKYC Training Attendance Form" 
        : "WiFi Choupal Training Attendance Form";

      const formattedStart = `${startVal}:00+05:30`;
      const formattedExpiry = `${expVal}:00+05:30`;

      const nowBuffer = new Date(Date.now() - 2 * 60 * 1000);
      if (new Date(formattedStart) < nowBuffer) {
        status.textContent = "❌ Start Date & Time aane wale samay ka hona chahiye!";
        status.className = "status error";
        return;
      }

      if (new Date(formattedStart) >= new Date(formattedExpiry)) {
        status.textContent = "❌ Expiry Date/Time Start Date/Time ke baad ka hona chahiye!";
        status.className = "status error";
        return;
      }

      localStorage.setItem("gh_pat", token);
      saveBtn.disabled = true;
      status.textContent = "Updating & Deploying Session...";

      try {
        const getRes = await fetch(API_URL, { headers: { "Authorization": `token ${token}` } });
        let sha = "";
        let existingConfig = { trainings: [] };

        if (getRes.ok) {
          const getData = await getRes.json();
          sha = getData.sha;
          existingConfig = JSON.parse(base64ToUtf8(getData.content));
        }

        if (!existingConfig.trainings || !Array.isArray(existingConfig.trainings)) {
          existingConfig.trainings = [];
        }

        // Auto-Cleanup: Expired sessions remove karein
        const nowTime = new Date();
        existingConfig.trainings = existingConfig.trainings.filter(t => {
          if (!t.expiry) return false;
          let expDateStr = t.expiry.trim();
          if (!expDateStr.includes('+') && !expDateStr.includes('Z')) {
            expDateStr += ":00+05:30";
          }
          const exp = new Date(expDateStr);
          return !isNaN(exp.getTime()) && exp > nowTime;
        });

        let targetIndex = existingConfig.trainings.findIndex(t => t.id === uniqueId);
        const newEntry = {
          id: uniqueId,
          topic_id: topicValue,
          name: sessionName,
          password: pwd,
          start_time: formattedStart,
          expiry: formattedExpiry
        };

        if (targetIndex !== -1) {
          existingConfig.trainings[targetIndex] = newEntry;
        } else {
          existingConfig.trainings.push(newEntry);
        }

        const contentEncoded = utf8ToBase64(JSON.stringify(existingConfig, null, 2));

        const putRes = await fetch(API_URL, {
          method: "PUT",
          headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({
            message: `Deployed: ${sessionName}`,
            content: contentEncoded,
            sha: sha ? sha : undefined
          })
        });

        if (putRes.ok) {
          status.textContent = "✅ Session Successfully Live & Deployed!";
          status.className = "status success";

          document.getElementById("password").value = "";
          document.getElementById("startTime").value = "";
          document.getElementById("expiry").value = "";

          fetchCurrentConfig();
        } else {
          const errData = await putRes.json();
          status.textContent = "❌ Error: " + (errData.message || "Failed to update");
          status.className = "status error";
        }
      } catch (err) {
        status.textContent = "❌ Network Error!";
        status.className = "status error";
      } finally {
        saveBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
